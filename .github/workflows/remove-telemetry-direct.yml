name: Remove Firebase telemetry

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-telemetry:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'remove-telemetry-v2'
    runs-on: ubuntu-latest

    steps:
      - name: Check out change branch
        uses: actions/checkout@v4
        with:
          ref: remove-telemetry-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm

      - name: Remove telemetry source, configuration and dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          def edit(path: str, transform) -> None:
              target = Path(path)
              raw = target.read_bytes()
              newline = '\r\n' if b'\r\n' in raw else '\n'
              original = raw.decode('utf-8').replace('\r\n', '\n')
              updated = transform(original)
              if updated == original:
                  raise SystemExit(f'No se encontró el bloque esperado en {path}')
              target.write_bytes(updated.replace('\n', newline).encode('utf-8'))

          def remove_exact(text: str, pattern: str, replacement: str = '', count: int = 1) -> str:
              updated, matches = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=count,
                  flags=re.MULTILINE | re.DOTALL,
              )
              if matches != count:
                  raise SystemExit(
                      f'Patrón esperado {count} vez/veces; encontrado {matches}: {pattern[:100]}'
                  )
              return updated

          def edit_app_config(text: str) -> str:
              text = remove_exact(
                  text,
                  r"\Aconst fs = require\('fs'\);\nconst path = require\('path'\);\n\n"
                  r"const androidGoogleServicesFile = './google-services\.json';\n"
                  r"const iosGoogleServicesFile = './GoogleService-Info\.plist';\n"
                  r"const hasAndroidGoogleServices = fs\.existsSync\(\n"
                  r"  path\.resolve\(__dirname, androidGoogleServicesFile\),\n"
                  r"\);\n"
                  r"const hasIosGooglePlist = fs\.existsSync\(\n"
                  r"  path\.resolve\(__dirname, iosGoogleServicesFile\),\n"
                  r"\);\n",
              )
              text = remove_exact(
                  text,
                  r"    \.\.\.\(hasAndroidGoogleServices \|\| hasIosGooglePlist\n"
                  r"      \? \['@react-native-firebase/app'\]\n"
                  r"      : \[\]\),\n"
                  r"    \.\.\.\(hasAndroidGoogleServices \|\| hasIosGooglePlist\n"
                  r"      \? \['@react-native-firebase/crashlytics'\]\n"
                  r"      : \[\]\),\n",
              )
              text = remove_exact(
                  text,
                  r"        \.\.\.\(hasAndroidGoogleServices\n"
                  r"          \? \{googleServicesFile: androidGoogleServicesFile\}\n"
                  r"          : \{\}\),\n",
              )
              text = remove_exact(
                  text,
                  r"      ios: \{\n"
                  r"        \.\.\.\(hasIosGooglePlist\n"
                  r"          \? \{googleServicesFile: iosGoogleServicesFile\}\n"
                  r"          : \{\}\),\n"
                  r"      \},\n",
                  "      ios: {},\n",
              )
              text = remove_exact(
                  text,
                  r"        hasFirebase: hasAndroidGoogleServices \|\| hasIosGooglePlist,\n",
              )
              return text

          def edit_app(text: str) -> str:
              text = remove_exact(
                  text,
                  r"import \{\n"
                  r"  getAnalytics,\n"
                  r"  getCrashlytics,\n"
                  r"  isFirebaseNativeReady,\n"
                  r"\} from './lib/utils/firebaseSafe';\n",
              )
              text = remove_exact(
                  text,
                  r"  const hasFirebase =\n"
                  r"    Boolean\(Constants\?\.expoConfig\?\.extra\?\.hasFirebase\) &&\n"
                  r"    isFirebaseNativeReady\(\);\n",
              )
              text = remove_exact(
                  text,
                  r"    // Apply telemetry preference before using analytics\n"
                  r"    const optIn = settingsStorage\.isTelemetryOptIn\(\);\n"
                  r"    if \(hasFirebase\) \{.*?"
                  r"    \}\n\n"
                  r"(?=    const unsubscribe = notifee\.onForegroundEvent)",
              )
              text = remove_exact(
                  text,
                  r"                  // Track initial screen\n"
                  r"                  if \(hasFirebase\) \{.*?"
                  r"                  \}\n",
              )
              text = remove_exact(
                  text,
                  r"                onStateChange=\{async \(\) => \{\n"
                  r"                  if \(hasFirebase\) \{.*?"
                  r"                  \}\n"
                  r"                \}\}\n",
              )
              return text

          def edit_preferences(text: str) -> str:
              text = remove_exact(text, r"import Constants from 'expo-constants';\n")
              text = remove_exact(
                  text,
                  r"import \{\n"
                  r"  getAnalytics,\n"
                  r"  getCrashlytics,\n"
                  r"  isFirebaseNativeReady,\n"
                  r"\} from '../../lib/utils/firebaseSafe';\n",
              )
              text = remove_exact(
                  text,
                  r"  const hasFirebase =\n"
                  r"    Boolean\(Constants\?\.expoConfig\?\.extra\?\.hasFirebase\) &&\n"
                  r"    isFirebaseNativeReady\(\);\n",
              )
              text = remove_exact(
                  text,
                  r"  const \[telemetryOptIn, setTelemetryOptIn\] = useState<boolean>\(\n"
                  r"    settingsStorage\.isTelemetryOptIn\(\),\n"
                  r"  \);\n",
              )
              text = remove_exact(
                  text,
                  r"\n        \{hasFirebase \? \(\n"
                  r"          <SettingsSection title=\"Privacy\">.*?"
                  r"          </SettingsSection>\n"
                  r"        \) : null\}\n",
                  "\n",
              )
              return text

          def edit_error_boundary(text: str) -> str:
              text = remove_exact(text, r"import Constants from 'expo-constants';\n")
              text = remove_exact(
                  text,
                  r"import \{getCrashlytics, isFirebaseNativeReady\} from '../lib/utils/firebaseSafe';\n",
              )
              text = remove_exact(
                  text,
                  r"\n    // Report to Crashlytics\n"
                  r"    try \{.*?"
                  r"    \} catch \{\}\n",
                  "\n",
              )
              return text

          def edit_settings_storage(text: str) -> str:
              text = remove_exact(
                  text,
                  r"\n  // Telemetry \(privacy\)\n"
                  r"  TELEMETRY_OPT_IN = 'telemetryOptIn',\n",
                  "\n",
              )
              text = remove_exact(
                  text,
                  r"\n  // Telemetry / Privacy\n"
                  r"  isTelemetryOptIn\(\): boolean \{\n"
                  r"    return mainStorage\.getBool\(SettingsKeys\.TELEMETRY_OPT_IN, true\);\n"
                  r"  \}\n\n"
                  r"  setTelemetryOptIn\(enabled: boolean\): void \{\n"
                  r"    mainStorage\.setBool\(SettingsKeys\.TELEMETRY_OPT_IN, enabled\);\n"
                  r"  \}\n",
                  "\n",
              )
              return text

          def edit_settings_test(text: str) -> str:
              return remove_exact(
                  text,
                  r"    expect\(settingsStorage\.isTelemetryOptIn\(\)\)\.toBe\(true\);\n",
              )

          edit('app.config.js', edit_app_config)
          edit('src/App.tsx', edit_app)
          edit('src/screens/settings/Preference.tsx', edit_preferences)
          edit('src/components/GlobalErrorBoundary.tsx', edit_error_boundary)
          edit('src/lib/storage/SettingsStorage.ts', edit_settings_storage)
          edit('__tests__/settingsStorage.test.ts', edit_settings_test)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          removed = []
          for name in (
              '@react-native-firebase/analytics',
              '@react-native-firebase/app',
              '@react-native-firebase/crashlytics',
          ):
              if package.get('dependencies', {}).pop(name, None) is not None:
                  removed.append(name)
          if len(removed) != 3:
              raise SystemExit(f'Dependencias Firebase esperadas: 3; eliminadas: {removed}')
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          for path in ('src/lib/utils/firebaseSafe.ts', 'firebase.json'):
              target = Path(path)
              if not target.exists():
                  raise SystemExit(f'No existe el archivo esperado: {path}')
              target.unlink()
          PY

          npm install --package-lock-only --ignore-scripts

          rm -f .github/workflows/remove-telemetry-direct.yml

          forbidden='@react-native-firebase|firebaseSafe|hasFirebase|Crashlytics|crashlytics|TELEMETRY_OPT_IN|telemetryOptIn|isTelemetryOptIn|setTelemetryOptIn|analytics_storage|ad_storage|ad_user_data|ad_personalization'
          if git grep -nEi "$forbidden" -- ':!node_modules'; then
            printf '%s\n' 'Quedaron referencias de telemetría.' >&2
            exit 1
          fi

          git diff --check
          node -e "JSON.parse(require('fs').readFileSync('package.json')); JSON.parse(require('fs').readFileSync('package-lock.json'));"

      - name: Install dependencies and run tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm test -- --runInBand

      - name: Commit verified removal
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: remove Firebase telemetry'
          git push origin HEAD:remove-telemetry-v2
