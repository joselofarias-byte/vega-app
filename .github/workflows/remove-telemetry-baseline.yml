name: Baseline-check Firebase telemetry removal

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  baseline-check-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'remove-telemetry-v2'
    runs-on: ubuntu-latest

    steps:
      - name: Check out change branch
        uses: actions/checkout@v4
        with:
          ref: remove-telemetry-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm

      - name: Apply removal and validate syntax
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/remove-telemetry-direct.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines(keepends=True)
          marker = '      - name: Remove telemetry source, configuration and dependencies\n'

          try:
              step = lines.index(marker)
              run_line = next(
                  index
                  for index in range(step + 1, len(lines))
                  if lines[index] == '        run: |\n'
              )
          except (ValueError, StopIteration) as error:
              raise SystemExit(f'No se pudo extraer el paso de eliminación: {error}')

          body = []
          for line in lines[run_line + 1:]:
              if line.startswith('      - name: '):
                  break
              if line.strip() and not line.startswith('          '):
                  raise SystemExit(f'Indentación inesperada: {line!r}')
              body.append(line[10:] if line.startswith('          ') else '\n')

          script = ''.join(body).replace(
              'git diff --check',
              'git -c core.whitespace=cr-at-eol diff --check',
          )
          Path('/tmp/remove-telemetry.sh').write_text(script, encoding='utf-8')
          PY

          bash /tmp/remove-telemetry.sh

          python3 <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          broken = (
              "                  await BootSplash.hide({fade: true});\n"
              "                    } catch {}\n"
              "                  }\n"
              "                }}\n"
          )
          fixed = (
              "                  await BootSplash.hide({fade: true});\n"
              "                }}\n"
          )
          if text.count(broken) != 1:
              raise SystemExit('No se encontró exactamente una callback de navegación incompleta')
          path.write_text(text.replace(broken, fixed), encoding='utf-8')
          PY

          forbidden='@react-native-firebase|firebaseSafe|hasFirebase|Crashlytics|crashlytics|TELEMETRY_OPT_IN|telemetryOptIn|isTelemetryOptIn|setTelemetryOptIn|analytics_storage|ad_storage|ad_user_data|ad_personalization'
          if git grep -nEi "$forbidden" -- ':!node_modules'; then
            printf '%s\n' 'Quedaron referencias de telemetría.' >&2
            exit 1
          fi

          git -c core.whitespace=cr-at-eol diff --check
          node -e "require('@babel/core').transformFileSync('src/App.tsx', {configFile: './babel.config.js'});"

      - name: Compare Jest result with unchanged main
        shell: bash
        run: |
          set -Eeuo pipefail
          git worktree add --detach /tmp/vega-main origin/main

          npm ci --legacy-peer-deps
          npm run build:sandbox
          set +e
          npx jest --runInBand --json --outputFile=/tmp/changed-jest.json
          changed_rc=$?
          set -e
          printf '%s\n' "$changed_rc" >/tmp/changed-jest.rc

          (
            cd /tmp/vega-main
            npm ci --legacy-peer-deps
            npm run build:sandbox
            set +e
            npx jest --runInBand --json --outputFile=/tmp/main-jest.json
            main_rc=$?
            set -e
            printf '%s\n' "$main_rc" >/tmp/main-jest.rc
          )

          python3 <<'PY'
          import json
          from pathlib import Path

          def result(path: str):
              data = json.loads(Path(path).read_text(encoding='utf-8'))
              failed = sorted(
                  Path(item['name']).name
                  for item in data.get('testResults', [])
                  if item.get('status') == 'failed'
              )
              return failed, data.get('numFailedTests'), data.get('numPassedTests')

          changed = result('/tmp/changed-jest.json')
          baseline = result('/tmp/main-jest.json')
          changed_rc = int(Path('/tmp/changed-jest.rc').read_text().strip())
          baseline_rc = int(Path('/tmp/main-jest.rc').read_text().strip())

          print('Main:', baseline, 'RC:', baseline_rc)
          print('Sin telemetría:', changed, 'RC:', changed_rc)

          if changed[0] != baseline[0]:
              raise SystemExit('Cambió el conjunto de suites fallidas respecto de main')
          if changed[1] != baseline[1]:
              raise SystemExit('Cambió la cantidad de pruebas fallidas respecto de main')
          PY

      - name: Commit verified removal
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/remove-telemetry-direct.yml \
            .github/workflows/remove-telemetry-final.yml \
            .github/workflows/remove-telemetry-verified.yml \
            .github/workflows/remove-telemetry-compare.yml \
            .github/workflows/remove-telemetry-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'chore: remove Firebase telemetry'
          git push origin HEAD:remove-telemetry-v2
