name: Build telemetry-free Android APK

on:
  push:
    branches:
      - remove-telemetry-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
      MYAPP_UPLOAD_STORE_PASSWORD: telemetryfree
      MYAPP_UPLOAD_KEY_ALIAS: vega-telemetry-free
      MYAPP_UPLOAD_KEY_PASSWORD: telemetryfree

    steps:
      - name: Check out telemetry-free branch
        uses: actions/checkout@v4
        with:
          ref: remove-telemetry-v2
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify telemetry removal
        shell: bash
        run: |
          set -Eeuo pipefail
          forbidden='@react-native-firebase|firebaseSafe|hasFirebase|FirebaseAnalytics|FirebaseCrashlytics|Crashlytics|crashlytics|TELEMETRY_OPT_IN|telemetryOptIn|isTelemetryOptIn|setTelemetryOptIn|analytics_storage|ad_storage|ad_user_data|ad_personalization'
          targets=(src app.config.js package.json package-lock.json)
          residual="$(grep -RInE "$forbidden" "${targets[@]}" --exclude-dir=node_modules --exclude-dir=build 2>/dev/null || true)"
          if [[ -n "$residual" ]]; then
            printf '%s\n' "$residual" >&2
            exit 1
          fi

      - name: Generate Android project
        run: |
          npm run build:sandbox
          npx expo prebuild --platform android --clean

      - name: Generate temporary release signing key
        shell: bash
        run: |
          set -Eeuo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/vega-telemetry-free.keystore" \
            -storepass "$MYAPP_UPLOAD_STORE_PASSWORD" \
            -alias "$MYAPP_UPLOAD_KEY_ALIAS" \
            -keypass "$MYAPP_UPLOAD_KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Vega Telemetry Free, O=Local Build, C=UY'
          printf 'MYAPP_UPLOAD_STORE_FILE=%s\n' "$RUNNER_TEMP/vega-telemetry-free.keystore" >>"$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect and verify APK
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          mapfile -t apks < <(find android/app/build/outputs/apk/release -type f -name '*.apk' | sort)
          ((${#apks[@]} > 0)) || {
            printf 'No se encontró un APK release.\n' >&2
            exit 1
          }

          source_apk="${apks[0]}"
          target_apk='dist/Vega-4.0.3-sin-telemetria-release.apk'
          cp "$source_apk" "$target_apk"

          zipalign_bin="$(command -v zipalign || true)"
          if [[ -z "$zipalign_bin" ]]; then
            zipalign_bin="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          fi
          "$zipalign_bin" -c -P 16 -v 4 "$target_apk"

          apksigner_bin="$(command -v apksigner || true)"
          if [[ -z "$apksigner_bin" ]]; then
            apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          fi
          "$apksigner_bin" verify --verbose --print-certs "$target_apk" | tee dist/apksigner-verification.txt
          sha256sum "$target_apk" | tee dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vega-4.0.3-sin-telemetria-release
          path: dist/
          if-no-files-found: error
          retention-days: 7
