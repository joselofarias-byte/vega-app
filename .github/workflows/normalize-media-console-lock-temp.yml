name: Validate media-console lockfile (temporary)

on:
  push:
    branches:
      - port/upstream-player-buffering-20260812
    paths:
      - .github/workflows/normalize-media-console-lock-temp.yml

permissions:
  contents: write

jobs:
  validate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: port/upstream-player-buffering-20260812
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin React DOM and regenerate lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (pkg.dependencies?.react !== '19.2.3') {
            throw new Error(`Unexpected React version: ${pkg.dependencies?.react}`);
          }
          const current = pkg.dependencies?.['react-dom'];
          if (current && current !== '19.2.3') {
            throw new Error(`Unexpected react-dom version: ${current}`);
          }
          pkg.dependencies['react-dom'] = '19.2.3';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate dependency and privacy invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = '2.2.4-alpha.43';
          const locked = lock.packages?.['node_modules/@8man/react-native-media-console'];

          if (pkg.version !== '4.0.3' || lock.version !== '4.0.3') {
            throw new Error('Application version changed unexpectedly');
          }
          if (pkg.dependencies?.react !== '19.2.3' || pkg.dependencies?.['react-dom'] !== '19.2.3') {
            throw new Error('React/react-dom versions are not pinned together');
          }
          if (lock.packages?.['node_modules/react-dom']?.version !== '19.2.3') {
            throw new Error(`Locked react-dom is ${lock.packages?.['node_modules/react-dom']?.version || 'missing'}`);
          }
          if (pkg.dependencies?.['@8man/react-native-media-console'] !== expected) {
            throw new Error('package.json media-console spec mismatch');
          }
          if (lock.packages?.['']?.dependencies?.['@8man/react-native-media-console'] !== expected) {
            throw new Error('package-lock root media-console spec mismatch');
          }
          if (locked?.version !== expected) {
            throw new Error(`Locked media-console is ${locked?.version || 'missing'}`);
          }
          if (locked?.peerDependencies?.['react-native-svg'] !== '>=15.0.0') {
            throw new Error('media-console SVG peer dependency missing');
          }

          const forbidden = [
            '@react-native-firebase/app',
            '@react-native-firebase/analytics',
            '@react-native-firebase/crashlytics',
            'react-native-google-cast',
          ];
          for (const name of forbidden) {
            if (Object.prototype.hasOwnProperty.call(pkg.dependencies || {}, name)) {
              throw new Error(`Forbidden dependency in package.json: ${name}`);
            }
            if (Object.prototype.hasOwnProperty.call(lock.packages || {}, `node_modules/${name}`)) {
              throw new Error(`Forbidden dependency in package-lock.json: ${name}`);
            }
          }

          console.log(`media-console=${locked.version}`);
          console.log('React/react-dom=19.2.3');
          console.log('dependency/privacy invariants: OK');
          NODE

      - name: Verify clean install
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate adaptation scripts syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check scripts/fix-rnv-buffer-memory.js
          node --check scripts/fix-player-buffering-source.js

      - name: Apply adaptations
        shell: bash
        run: |
          set -Eeuo pipefail
          npx patch-package
          node scripts/fix-rnv-buffer-memory.js
          node scripts/fix-player-buffering-source.js

      - name: Verify adaptation idempotence
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/fix-rnv-buffer-memory.js
          node scripts/fix-player-buffering-source.js

      - name: Run project tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm test -- --runInBand

      - name: Commit validated dependency state and remove temporary workflow
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/normalize-media-console-lock-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/normalize-media-console-lock-temp.yml
          git commit -m 'fix(deps): align React DOM and validate media-console alpha.43'
          git push origin HEAD:port/upstream-player-buffering-20260812
