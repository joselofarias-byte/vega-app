name: Verify Jest App smoke (temporary)

on:
  push:
    branches:
      - port/upstream-player-buffering-20260812
    paths:
      - __mocks__/expo-crypto.js
      - .github/workflows/verify-jest-app-temp.yml

jobs:
  verify-jest-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: port/upstream-player-buffering-20260812

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply postinstall adaptations
        run: npm run postinstall

      - name: Activate expo-crypto manual mock in App smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('__tests__/App.test.tsx')
          text = path.read_text()
          marker = "jest.mock('expo-crypto');\n\n"
          if marker not in text:
              anchor = "jest.mock('react-native-image-colors', () => ({"
              if anchor not in text:
                  raise SystemExit('App smoke anchor not found')
              text = text.replace(anchor, marker + anchor, 1)
              path.write_text(text)
          PY

      - name: Verify former infrastructure failures
        run: >-
          npx jest --runInBand
          __tests__/downloadManagerLifecycle.test.ts
          __tests__/Extensions.test.tsx
          __tests__/DownloadBottomSheet.test.tsx
          __tests__/App.test.tsx

      - name: Run full suite
        run: npm test -- --runInBand
