name: Language preferences validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/language-preferences-check.yml'
      - '__tests__/languagePreferences.test.ts'
      - 'src/lib/hooks/useStream.ts'
      - 'src/lib/languagePreferences.ts'
      - 'src/lib/storage/languagePreferencesStorage.ts'
      - 'src/screens/settings/Preference.tsx'
      - 'src/screens/settings/components/LanguagePreferencesSection.tsx'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run focused Jest tests
        run: npm test -- --runInBand __tests__/languagePreferences.test.ts

      - name: Run ESLint on changed sources
        run: >-
          npx eslint
          src/lib/hooks/useStream.ts
          src/lib/languagePreferences.ts
          src/lib/storage/languagePreferencesStorage.ts
          src/screens/settings/Preference.tsx
          src/screens/settings/components/LanguagePreferencesSection.tsx
          __tests__/languagePreferences.test.ts

      - name: Run TypeScript check
        run: npx tsc --noEmit --pretty false

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vega-language-preferences-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
