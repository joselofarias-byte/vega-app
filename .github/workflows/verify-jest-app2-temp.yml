name: Verify Jest App smoke v2 (temporary)

on:
  push:
    branches:
      - port/upstream-player-buffering-20260812
    paths:
      - .github/workflows/verify-jest-app2-temp.yml

jobs:
  verify-jest-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: port/upstream-player-buffering-20260812

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply postinstall adaptations
        run: npm run postinstall

      - name: Activate App smoke native mocks
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('__tests__/App.test.tsx')
          text = path.read_text()
          anchor = "jest.mock('react-native-image-colors', () => ({"
          if anchor not in text:
              raise SystemExit('App smoke anchor not found')
          mocks = (
              "jest.mock('expo-crypto');\n"
              "jest.mock('@dr.pogodin/react-native-fs', () => ({}));\n"
              "jest.mock('expo-file-system/legacy', () => ({}));\n\n"
          )
          if mocks not in text:
              text = text.replace(anchor, mocks + anchor, 1)
              path.write_text(text)
          PY

      - name: Verify App smoke only
        run: npx jest --runInBand __tests__/App.test.tsx
