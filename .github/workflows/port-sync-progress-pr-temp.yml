name: Temporary PR sync progress port

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  port:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply selective port
        run: |
          set -Eeuo pipefail
          python3 tools/port-sync-progress.py
          git diff --check
          grep -q "export const setSyncedEpisodeProgress" src/lib/sync/syncService.ts
          grep -q "setSyncedEpisodeProgress" src/components/SeasonList.tsx
          grep -q "const MAX_HISTORY_ITEMS = 100;" src/lib/sync/syncService.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SeasonList.tsx src/lib/sync/syncService.ts
          git commit -m 'feat(sync): sync manual episode progress'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
