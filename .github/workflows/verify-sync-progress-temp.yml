name: Verify sync progress port

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test -- --runInBand __tests__/syncManifest.test.ts
      - run: npx eslint src/components/SeasonList.tsx src/lib/sync/syncService.ts
      - run: npx tsc --noEmit
