name: Finalize Firebase telemetry removal

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'remove-telemetry-v2'
    runs-on: ubuntu-latest

    steps:
      - name: Check out change branch
        uses: actions/checkout@v4
        with:
          ref: remove-telemetry-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm

      - name: Apply removal and validate source
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/remove-telemetry-direct.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines(keepends=True)
          marker = '      - name: Remove telemetry source, configuration and dependencies\n'

          try:
              step = lines.index(marker)
              run_line = next(
                  index
                  for index in range(step + 1, len(lines))
                  if lines[index] == '        run: |\n'
              )
          except (ValueError, StopIteration) as error:
              raise SystemExit(f'No se pudo extraer el paso de eliminación: {error}')

          body = []
          for line in lines[run_line + 1:]:
              if line.startswith('      - name: '):
                  break
              if line.strip() and not line.startswith('          '):
                  raise SystemExit(f'Indentación inesperada: {line!r}')
              body.append(line[10:] if line.startswith('          ') else '\n')

          script = ''.join(body)
          script = script.replace(
              'git diff --check',
              'git -c core.whitespace=cr-at-eol diff --check',
          )
          if 'git -c core.whitespace=cr-at-eol diff --check' not in script:
              raise SystemExit('No se corrigió la validación CRLF')

          Path('/tmp/remove-telemetry.sh').write_text(script, encoding='utf-8')
          PY

          bash /tmp/remove-telemetry.sh

      - name: Install dependencies and run tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm test -- --runInBand

      - name: Commit verified removal
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/remove-telemetry-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'chore: remove Firebase telemetry'
          git push origin HEAD:remove-telemetry-v2
