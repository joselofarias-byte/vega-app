name: Minimize telemetry lockfile diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  minimize-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'remove-telemetry-v2'
    runs-on: ubuntu-latest

    steps:
      - name: Check out telemetry branch
        uses: actions/checkout@v4
        with:
          ref: remove-telemetry-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm

      - name: Rebuild a minimal lockfile diff
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import json
          import subprocess
          from pathlib import Path

          names = {
              '@react-native-firebase/analytics',
              '@react-native-firebase/app',
              '@react-native-firebase/crashlytics',
          }

          baseline = json.loads(
              subprocess.check_output(
                  ['git', 'show', 'origin/main:package-lock.json'],
                  text=True,
              )
          )
          resolved = json.loads(Path('package-lock.json').read_text(encoding='utf-8'))

          baseline_packages = baseline.get('packages')
          resolved_packages = resolved.get('packages')
          if not isinstance(baseline_packages, dict) or not isinstance(resolved_packages, dict):
              raise SystemExit('package-lock.json no usa el formato packages esperado')

          root = baseline_packages.get('')
          if not isinstance(root, dict):
              raise SystemExit('Falta el paquete raíz del lockfile')

          dependencies = root.get('dependencies')
          if not isinstance(dependencies, dict):
              raise SystemExit('Faltan las dependencias raíz del lockfile')

          missing = sorted(name for name in names if name not in dependencies)
          if missing:
              raise SystemExit(f'Firebase no estaba en el lockfile base: {missing}')
          for name in names:
              del dependencies[name]

          removed_keys = sorted(set(baseline_packages) - set(resolved_packages))
          expected_roots = {f'node_modules/{name}' for name in names}
          if not expected_roots.issubset(removed_keys):
              raise SystemExit(
                  'El lockfile resuelto no eliminó todos los módulos Firebase raíz'
              )

          for key in removed_keys:
              del baseline_packages[key]

          legacy_dependencies = baseline.get('dependencies')
          if isinstance(legacy_dependencies, dict):
              for name in names:
                  legacy_dependencies.pop(name, None)

          added_keys = sorted(set(resolved_packages) - set(json.loads(
              subprocess.check_output(
                  ['git', 'show', 'origin/main:package-lock.json'],
                  text=True,
              )
          )['packages']))

          print(f'Paquetes eliminados del lockfile: {len(removed_keys)}')
          print(f'Altas ajenas descartadas: {len(added_keys)}')

          Path('package-lock.json').write_text(
              json.dumps(baseline, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY

          if grep -nEi '@react-native-firebase|node_modules/@firebase|node_modules/firebase' package-lock.json; then
            printf '%s\n' 'Persisten paquetes Firebase en package-lock.json.' >&2
            exit 1
          fi

          git -c core.whitespace=cr-at-eol diff --check
          node -e "JSON.parse(require('fs').readFileSync('package.json')); JSON.parse(require('fs').readFileSync('package-lock.json'));"

      - name: Verify installation and application parsing
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --legacy-peer-deps
          npm run build:sandbox
          node -e "require('@babel/core').transformFileSync('src/App.tsx', {configFile: './babel.config.js'});"

      - name: Commit minimal lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/minimize-telemetry-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'chore: minimize telemetry lockfile diff'
          git push origin HEAD:remove-telemetry-v2
